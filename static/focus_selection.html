<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,viewport-fit=cover" />
  <meta name="theme-color" content="#6d5dfc" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>What's Breaking Your Focus? — Focus Dost</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: #f3f4f6;
      font-family: "Manrope", "Segoe UI", system-ui, sans-serif;
    }

    .app-shell {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 0 32px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.08);
      background: #ffffff;
      flex-shrink: 0;
    }

    .app-brand {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      background: linear-gradient(145deg, #6d5dfc, #e17676);
      box-shadow: 0 8px 18px rgba(109, 93, 252, 0.24);
    }

    .top-bar h1 {
      margin: 0;
      font-size: 13px;
      letter-spacing: 0.15em;
      font-weight: 800;
      color: #0f172a;
    }

    .top-bar h1 span {
      letter-spacing: 0.08em;
      color: #334155;
    }

    .logout-btn {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    .focus-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 24px;
    }

    .focus-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 32px 40px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(39, 22, 116, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .focus-card-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .focus-card-header h2 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 8px 0;
    }

    .focus-card-header p {
      font-size: 14px;
      color: rgba(15, 23, 42, 0.65);
      margin: 0;
    }

    .focus-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .focus-other-option {
      text-align: center;
      margin-bottom: 20px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 10px;
      border: 2px dashed #e2e8f0;
      transition: all 0.2s ease;
    }

    .focus-other-option:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .focus-other-option.active {
      background: linear-gradient(120deg, rgba(255, 108, 171, 0.1), rgba(133, 97, 249, 0.1));
      border-color: #8561f9;
      border-style: solid;
    }

    .focus-other-link {
      color: #8561f9;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-block;
    }

    .focus-other-link:hover {
      color: #6d5dfc;
    }

    .focus-other-option.active .focus-other-link {
      color: #ff6cab;
      font-weight: 700;
    }

    .focus-option {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 8px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      min-height: 90px;
    }

    .focus-option:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    }

    .focus-option.checked {
      background: linear-gradient(120deg, #ff6cab, #8561f9);
      border-color: #8561f9;
      box-shadow: 0 8px 20px rgba(133, 97, 249, 0.3);
    }

    .focus-option.checked .focus-option-emoji {
      transform: scale(1.15);
    }

    .focus-option.checked .focus-option-text {
      color: white;
      font-weight: 700;
    }

    .focus-option.checked .focus-checkbox {
      background: white;
      border-color: white;
    }

    .focus-option.checked .focus-checkbox::after {
      opacity: 1;
    }

    .focus-option.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .focus-option input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .focus-checkbox {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 18px;
      height: 18px;
      border: 2px solid #cbd5e1;
      border-radius: 4px;
      background: white;
      transition: all 0.2s ease;
    }

    .focus-checkbox::after {
      content: "✓";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #8561f9;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .focus-option-emoji {
      font-size: 28px;
      margin-bottom: 6px;
      transition: transform 0.2s ease;
      line-height: 1;
    }

    .focus-option-text {
      font-size: 11px;
      font-weight: 600;
      color: #1e293b;
      line-height: 1.3;
      transition: color 0.2s ease;
    }

    .focus-selection-count {
      text-align: center;
      padding: 10px;
      background: #fef3c7;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 600;
      color: #92400e;
      display: none;
    }

    .focus-selection-count.show {
      display: block;
    }

    .focus-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(120deg, #ff6cab, #8561f9);
      color: white;
      box-shadow: 0 10px 25px rgba(133, 97, 249, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(133, 97, 249, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: transparent;
      color: #64748b;
      border: 2px solid #e2e8f0;
    }

    .btn-ghost:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    /* Mobile Responsive */
    @media (max-width: 900px) {
      .focus-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 768px) {
      .top-bar {
        min-height: 56px;
        padding: 0 16px;
        gap: 8px;
      }

      .top-bar h1 {
        font-size: 11px;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        font-size: 14px;
      }

      .focus-viewport {
        padding: 16px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .focus-card {
        padding: 24px 20px;
        border-radius: 16px;
      }

      .focus-card-header h2 {
        font-size: 20px;
      }

      .focus-card-header p {
        font-size: 13px;
      }

      .focus-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .focus-option {
        padding: 12px 6px;
        min-height: 80px;
      }

      .focus-option-emoji {
        font-size: 24px;
        margin-bottom: 4px;
      }

      .focus-option-text {
        font-size: 10px;
      }

      .focus-checkbox {
        width: 16px;
        height: 16px;
        top: 6px;
        right: 6px;
      }

      .focus-checkbox::after {
        font-size: 10px;
      }

      .focus-other-option {
        padding: 10px;
      }

      .focus-other-link {
        font-size: 13px;
      }

      .focus-selection-count {
        font-size: 12px;
        padding: 8px;
      }

      .btn {
        padding: 10px 20px;
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      .top-bar {
        min-height: 52px;
        padding: 0 12px;
      }

      .top-bar h1 {
        font-size: 10px;
      }

      .top-bar h1 span {
        display: none;
      }

      .brand-mark {
        width: 26px;
        height: 26px;
        font-size: 13px;
      }

      #userNameDisplay {
        font-size: 12px !important;
        max-width: 80px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #sessionCounter {
        font-size: 11px !important;
        padding: 3px 6px !important;
      }

      .logout-btn {
        padding: 5px 8px !important;
        font-size: 11px !important;
      }

      .focus-viewport {
        padding: 12px;
      }

      .focus-card {
        padding: 20px 16px;
      }

      .focus-card-header h2 {
        font-size: 18px;
      }

      .focus-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }

      .focus-option {
        padding: 10px 4px;
        min-height: 75px;
      }

      .focus-option-emoji {
        font-size: 22px;
      }

      .focus-option-text {
        font-size: 9px;
      }

      .btn {
        padding: 10px 16px;
        font-size: 13px;
      }
    }

    @media (max-width: 375px) {
      .focus-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .focus-option {
        min-height: 70px;
        padding: 8px 4px;
      }

      .focus-option-emoji {
        font-size: 20px;
      }

      .focus-option-text {
        font-size: 8.5px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="app-brand">
        <div class="brand-mark" aria-hidden="true">☯</div>
        <div>
          <h1>FOCUS DOST <span>(v1.0)</span></h1>
        </div>
      </div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <span id="userNameDisplay" style="font-size: 14px; color: rgba(15, 23, 42, 0.7);"></span>
        <span id="sessionCounter" style="
          font-size: 13px;
          color: #334155;
          background: rgba(59, 130, 246, 0.1);
          padding: 4px 10px;
          border-radius: 12px;
          font-weight: 600;
          display: none;
        ">Sessions: 0</span>
        <button id="btnLogout" class="logout-btn" title="Logout" type="button">Logout</button>
      </div>
    </header>

    <div class="focus-viewport">
      <div class="focus-card">
        <div class="focus-card-header">
          <h2><span id="userName">Hey</span>, what makes you feel distracted? 🤔</h2>
          <p>Select up to 3 challenges you're facing (tap to select)</p>
        </div>

        <div id="focusSelectionCount" class="focus-selection-count"></div>

        <div class="focus-grid" id="focusGrid">
          <!-- Options will be generated by JavaScript -->
        </div>

        <div class="focus-other-option" id="otherOptionBox">
          <a href="#" class="focus-other-link" id="btnOtherOption">
            Other - Tell us something else
          </a>
        </div>

        <div class="focus-actions">
          <button type="button" class="btn btn-ghost" id="btnBack">← Back</button>
          <button type="button" class="btn btn-primary" id="btnContinue" disabled>Continue →</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/auth.js"></script>
  <script>
    (function() {
      const MAX_SELECTIONS = 3;
      
      const focusOptions = [
        { value: 'phone-addiction', emoji: '📱', text: 'Phone Addiction' },
        { value: 'social-media', emoji: '📸', text: 'Social Media Addiction' },
        { value: 'entertainment', emoji: '🎬', text: 'Entertainment Distraction' },
        { value: 'sports-gaming', emoji: '🎮', text: 'Sports & Gaming Distraction' },
        { value: 'exam-stress', emoji: '😰', text: 'Exam Stress & Anxiety' },
        { value: 'overthinking', emoji: '💭', text: 'Overthinking' },
        { value: 'low-motivation', emoji: '😩', text: 'Low Motivation' },
        { value: 'consistency', emoji: '🚫', text: 'Lack of Consistency' },
        { value: 'time-management', emoji: '📅', text: 'Poor Time Management' },
        { value: 'sleep-issues', emoji: '😴', text: 'Sleep Issues' },
        { value: 'understanding', emoji: '📚', text: 'Difficulty Understanding Concepts' },
        { value: 'confidence', emoji: '😔', text: 'Low Confidence & Self-Doubt' },
        { value: 'family-pressure', emoji: '🏠', text: 'Family Pressure' },
        { value: 'burnout', emoji: '😵', text: 'Study Burnout' },
        { value: 'concentration', emoji: '🎯', text: 'Poor Concentration' }
      ];

      const focusGrid = document.getElementById('focusGrid');
      const btnContinue = document.getElementById('btnContinue');
      const btnBack = document.getElementById('btnBack');
      const btnOtherOption = document.getElementById('btnOtherOption');
      const otherOptionBox = document.getElementById('otherOptionBox');
      const selectionCount = document.getElementById('focusSelectionCount');
      const btnLogout = document.getElementById('btnLogout');
      const userNameDisplay = document.getElementById('userNameDisplay');
      const sessionCounter = document.getElementById('sessionCounter');

      let selectedCount = 0;
      let selectedOptions = [];
      let otherSelected = false;

      // Generate option elements
      focusOptions.forEach(option => {
        const label = document.createElement('label');
        label.className = 'focus-option';
        label.dataset.value = option.value;
        
        label.innerHTML = `
          <input type="checkbox" name="focus" value="${option.value}">
          <div class="focus-checkbox"></div>
          <div class="focus-option-emoji">${option.emoji}</div>
          <div class="focus-option-text">${option.text}</div>
        `;
        
        focusGrid.appendChild(label);
      });

      const checkboxes = document.querySelectorAll('input[name="focus"]');
      const optionLabels = document.querySelectorAll('.focus-option');

      // Update UI based on selections
      function updateSelections() {
        selectedOptions = Array.from(checkboxes)
          .filter(cb => cb.checked)
          .map(cb => {
            const option = focusOptions.find(o => o.value === cb.value);
            return {
              value: cb.value,
              text: option ? option.text : cb.value
            };
          });
        
        // Add "Other" if selected
        if (otherSelected) {
          selectedOptions.push({ value: 'other', text: 'Other' });
        }
        
        selectedCount = selectedOptions.length;

        // Update selection count message
        if (selectedCount > 0) {
          selectionCount.textContent = `${selectedCount} of ${MAX_SELECTIONS} challenge${selectedCount > 1 ? 's' : ''} selected`;
          selectionCount.classList.add('show');
          btnContinue.disabled = false;
        } else {
          selectionCount.classList.remove('show');
          btnContinue.disabled = true;
        }

        // Enable/disable options based on max selection
        optionLabels.forEach(label => {
          const checkbox = label.querySelector('input[type="checkbox"]');
          if (selectedCount >= MAX_SELECTIONS && !checkbox.checked) {
            label.classList.add('disabled');
          } else {
            label.classList.remove('disabled');
          }
        });

        // Disable "Other" link if max selections reached and not already selected
        if (selectedCount >= MAX_SELECTIONS && !otherSelected) {
          otherOptionBox.style.opacity = '0.4';
          otherOptionBox.style.pointerEvents = 'none';
        } else {
          otherOptionBox.style.opacity = '1';
          otherOptionBox.style.pointerEvents = 'auto';
        }
      }

      // Handle "Other" option click
      btnOtherOption.addEventListener('click', function(e) {
        e.preventDefault();
        
        if (selectedCount >= MAX_SELECTIONS && !otherSelected) {
          return;
        }
        
        otherSelected = !otherSelected;
        
        if (otherSelected) {
          otherOptionBox.classList.add('active');
        } else {
          otherOptionBox.classList.remove('active');
        }
        
        updateSelections();
      });

      // Handle checkbox changes
      checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', function() {
          const label = this.closest('.focus-option');
          
          if (this.checked) {
            label.classList.add('checked');
          } else {
            label.classList.remove('checked');
          }
          
          updateSelections();
        });
      });

      // Handle continue button
      btnContinue.addEventListener('click', function() {
        if (selectedCount === 0) {
          alert('Please select at least one challenge to continue.');
          return;
        }

        const focusData = {
          challenges: selectedOptions,
          count: selectedCount
        };

        // Store in sessionStorage
        sessionStorage.setItem('focusSelection', JSON.stringify(focusData));

        // Create text summary for the original flow (we'll ask for details on next page)
        const summaryText = selectedOptions.map(o => o.text).join(', ');
        sessionStorage.setItem('initialText', summaryText);

        // Redirect to details page
        window.location.href = '/focus_details.html';
      });

      // Handle back button
      btnBack.addEventListener('click', function() {
        window.location.href = '/login';
      });

      // Handle logout button
      if (btnLogout) {
        btnLogout.addEventListener('click', function() {
          if (confirm('Are you sure you want to logout?')) {
            // Clear user auth
            if (window.StressDostAuth && window.StressDostAuth.clearUser) {
              window.StressDostAuth.clearUser();
            }
            // Clear all storage
            sessionStorage.clear();
            try {
              localStorage.clear();
            } catch (e) {
              console.error('Failed to clear localStorage:', e);
            }
            window.location.href = '/login';
          }
        });
      }

      // Check if user is logged in and display info
      if (window.StressDostAuth) {
        const user = window.StressDostAuth.getUser();
        
        if (!user) {
          window.location.href = '/login';
        } else {
          // Display user info
          if (userNameDisplay && user.display_name) {
            userNameDisplay.textContent = user.display_name;
          }
          
          // Update header with user name
          const userNameHeader = document.getElementById('userName');
          if (userNameHeader && user.display_name) {
            userNameHeader.textContent = `Hey ${user.display_name}`;
          }
          
          if (sessionCounter && user.completed_sessions !== undefined) {
            sessionCounter.textContent = `Sessions: ${user.completed_sessions}`;
            sessionCounter.style.display = 'inline-block';
          }
        }
      }

      // Initialize
      updateSelections();
    })();
  </script>
</body>
</html>
