<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Focus & Accuracy Dost — Sign in</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <main class="viewport">
    <section class="stage active" id="stageName">
      <div class="glass intro-card name-card">
        <p class="eyebrow">Get started</p>
        <h2>What should we call you?</h2>
        <p>Enter your name to personalize the session.</p>
        <label for="displayName" class="label">Name</label>
        <input id="displayName" type="text" placeholder="Enter your name" />
        <div class="row" id="nameStepRow">
          <button id="btnNameNext" class="btn primary" type="button">Continue</button>
        </div>

        <div class="stage-hint" id="loginHint"></div>
      </div>
    </section>
  </main>

  <script src="/auth.js"></script>
  <script>
    (function () {
      var btnNext = document.getElementById("btnNameNext");
      var nameInput = document.getElementById("displayName");
      var hint = document.getElementById("loginHint");

      if (!window.StressDostAuth) return;

      // If already logged in, redirect to home
      if (window.StressDostAuth.getUser()) {
        window.location.replace("/");
        return;
      }

      function submitProfile() {
        if (hint) hint.textContent = "";
        var display_name = (nameInput || {}).value || "";
        
        if (!display_name.trim()) {
          if (hint) hint.textContent = "Please enter your name";
          return;
        }
        
        console.log('[Login] Checking profile for:', display_name.trim());
        fetch("/api/user/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: display_name.trim() })
        })
        .then(res => res.json())
        .then(data => {
          console.log('[Login] API response:', data);
          if (data.error) {
            if (hint) hint.textContent = data.error;
            return;
          }
          
          // Store user profile data
          window.StressDostAuth.setUser({
            user_id: data.user_id,
            display_name: data.name,
            total_sessions: data.total_sessions,
            completed_sessions: data.completed_sessions,
            is_new_user: data.is_new_user
          });
          
          console.log('[Login] User saved, redirecting to home');
          window.location.href = "/";
        })
        .catch(err => {
          console.error('[Login] Network error:', err);
          if (hint) hint.textContent = "Network error. Please try again.";
        });
      }

      if (btnNext) {
        btnNext.addEventListener("click", submitProfile);
      }

      if (nameInput) {
        nameInput.addEventListener("keypress", function(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            submitProfile();
          }
        });
      }
    })();
  </script>
</body>
</html>
